<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>スポット全体のプレビュー</title>
<style>
  body { margin: 24px; background: #f4eddb; color: #303d39; font: 15px sans-serif; }
  h1 { font-size: 24px; }
  main { display: grid; grid-template-columns: repeat(4, 288px); gap: 20px; margin-top: 24px; }
  figure { margin: 0; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  canvas { display: block; background: #d6c6a4; }
  figcaption { margin-top: 10px; font-size: 13px; }
  label { margin-right: 20px; }
</style>
<h1>スポット全体のプレビュー</h1>
<p>各マップを0.5倍で表示。通常表示では、その場所に出るこひとを時間帯にかかわらず全員並べています。</p>
<label><input id="bounds" type="checkbox">装飾の枠を表示（赤：障害物に見える物、緑：地面の模様）</label>
<label><input id="tiles-only" type="checkbox">地形だけを表示</label>
<label>時間帯 <select id="time"></select></label>
<main></main>
<script type="module">
  import { SPOT_IDS, TIMES } from '/src/game/state.ts';
  import { PROPS } from '/src/data/props.ts';
  import { KOHITO } from '/src/data/kohito.ts';
  import { TEXT } from '/src/data/text.ts';
  import { drawTiles, drawObjects } from '/src/render/tiles.ts';
  import { drawKohito } from '/src/render/kohitoArt.ts';
  import { P } from '/src/render/palette.ts';

  const time = document.querySelector('#time');
  for (const slot of TIMES) {
    const option = document.createElement('option'); option.value = slot; option.textContent = TEXT.times[slot];
    time.append(option);
  }
  const views = SPOT_IDS.map(spot => {
    const figure = document.createElement('figure');
    const title = document.createElement('h2'); title.textContent = TEXT.spots[spot];
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(288 * devicePixelRatio); canvas.height = Math.round(384 * devicePixelRatio);
    canvas.style.width = '288px'; canvas.style.height = '384px'; canvas.setAttribute('aria-label', TEXT.spots[spot]);
    const caption = document.createElement('figcaption');
    caption.textContent = `装飾 ${PROPS[spot].length}個・${new Set(PROPS[spot].map(prop => prop.kind)).size}種類`;
    figure.append(title, canvas, caption); document.querySelector('main').append(figure);
    return { spot, canvas };
  });
  function render() {
    const tilesOnly = document.querySelector('#tiles-only').checked;
    for (const { spot, canvas } of views) {
      const c = canvas.getContext('2d'); c.resetTransform(); c.clearRect(0, 0, canvas.width, canvas.height);
      c.scale(devicePixelRatio * 0.5, devicePixelRatio * 0.5);
      drawTiles(c, spot);
      if (!tilesOnly) {
        // drawObjectsは装飾→既存の目印の順に描く。
        drawObjects(c, spot, time.value, 0);
        for (const kohito of Object.values(KOHITO).filter(k => k.spot === spot)) {
          drawKohito(c, kohito.id, kohito.x, kohito.y, 0, false, false);
        }
      }
      c.fillStyle = P.time[time.value]; c.fillRect(0, 0, 576, 768);
      if (!tilesOnly && document.querySelector('#bounds').checked) {
        c.lineWidth = 1.5;
        for (const prop of PROPS[spot]) {
          c.strokeStyle = prop.solid ? P.red : P.green; c.strokeRect(prop.x, prop.y, prop.w, prop.h);
        }
      }
    }
  }
  document.querySelector('#bounds').onchange = render;
  document.querySelector('#tiles-only').onchange = render;
  time.onchange = render;
  render();
</script>
</html>
